[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-ingest-worker"
version = "0.1.0"
description = "Worker de ingesta: hash SHA-256 y metadatos de contenedor/códec vía ffprobe."
requires-python = ">=3.12"
# Versiones exactas: la reproducibilidad del entorno es un requisito pericial.
dependencies = [
    "fastapi==0.160.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]
