# PostgreSQL para desarrollo local. Credenciales en .env (ver .env.example), nunca en el repo.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: forense
      POSTGRES_USER: forense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data

volumes:
  postgres-datos:
