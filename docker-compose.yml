# Entorno local: PostgreSQL + servidor de custodia + worker de ingesta.
# Credenciales en .env (ver .env.example), nunca en el repo. Todo escucha sólo en 127.0.0.1.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: forense
      POSTGRES_USER: forense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}  # ggignore: se interpola desde .env, no es un secreto
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      # Por TCP: durante la inicialización hay un servidor temporal que sólo escucha por socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U forense -d forense"]
      interval: 5s
      retries: 10

  servidor:
    build:
      context: .
      dockerfile: src/server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Forense: Host=postgres;Database=forense;Username=forense;Password=${POSTGRES_PASSWORD}
      Persistencia__MigrarAlIniciar: "true"
      # Sin clave de firma el servidor no arranca; sin ningún admin activo, tampoco sin el seed del primero.
      Identidad__Jwt__ClaveDeFirma: ${JWT_CLAVE_DE_FIRMA:?Definí JWT_CLAVE_DE_FIRMA en .env}
      Identidad__AdminInicial__Usuario: ${ADMIN_INICIAL_USUARIO:-}
      Identidad__AdminInicial__Contrasena: ${ADMIN_INICIAL_CONTRASENA:-}
      # Control cruzado de cada ingesta. Con el worker caído se ingesta igual y el cruce queda pendiente.
      WorkerIngesta__UrlBase: http://worker-ingest:8000
      # Operaciones deterministas de OpenCV. Sin él no hay derivados (503), pero la custodia sigue.
      WorkerProcesamiento__UrlBase: http://worker-procesamiento:8000
      # Sellado de la cadena con la clave del laboratorio: sin ella el servidor no arranca.
      Custodia__Sellado__RutaClavePrivada: /run/secrets/clave-sellado
      # mTLS con las workstations: sólo entra un equipo con un certificado de la CA del laboratorio.
      # Sin estos tres, en Production el servidor no arranca (scripts/generar-certificados-mtls.sh).
      Tls__CertificadoServidor: /run/secrets/tls-servidor.crt
      Tls__ClaveServidor: /run/secrets/tls-servidor.key
      Tls__CaDeClientes: /run/secrets/tls-ca.crt
    secrets:
      - clave-sellado
      - tls-servidor.crt
      - tls-servidor.key
      - tls-ca.crt
    ports:
      - "127.0.0.1:5065:8443"
    volumes:
      - evidencia:/datos/evidencia
      # En producción, un volumen que el administrador de PostgreSQL no pueda escribir.
      - sellos:/datos/sellos
    depends_on:
      postgres:
        condition: service_healthy
      worker-ingest:
        condition: service_started
      worker-procesamiento:
        condition: service_started

  worker-ingest:
    build: src/workers/ingest
    ports:
      - "127.0.0.1:8000:8000"

  # Sin puerto publicado: sólo lo llama el servidor, por la red interna del compose.
  worker-procesamiento:
    build: src/workers/procesamiento

  # Worker de IA (sólo investigación): corre en la workstation del analista y sólo lo llama el
  # cliente local, nunca el servidor. Requiere nvidia-container-toolkit; sin GPU usar
  # scripts/verificar_imagen.sh o quitar el bloque deploy (cae a CPU con los mismos pesos).
  #   docker compose --profile workstation up -d worker-ia
  worker-ia:
    build: src/workers/ia
    profiles: ["workstation"]
    ports:
      - "127.0.0.1:8100:8000"
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres-datos:
  evidencia:
  sellos:

secrets:
  clave-sellado:
    file: ${CLAVE_SELLADO_ARCHIVO:?Definí CLAVE_SELLADO_ARCHIVO en .env}
  tls-servidor.crt:
    file: ${TLS_DIR:?Definí TLS_DIR en .env}/servidor.crt
  tls-servidor.key:
    file: ${TLS_DIR:?Definí TLS_DIR en .env}/servidor.key
  tls-ca.crt:
    file: ${TLS_DIR:?Definí TLS_DIR en .env}/ca.crt
