name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Todas las acciones van fijadas por SHA de commit (con su versión en el comentario): un tag se puede
# reescribir, un SHA no. Dependabot (.github/dependabot.yml) propone las actualizaciones.

jobs:
  servidor:
    name: Servidor .NET (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Los tests del informe pericial compilan y corren el verificador independiente (Go).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/verificador/go.mod
          cache: false
      - run: dotnet restore src/server/Forensic.sln
      - run: dotnet build src/server/Forensic.sln -c Release --no-restore
      # Los tests de integración levantan PostgreSQL con Testcontainers (Docker viene en el runner).
      - run: dotnet test src/server/Forensic.sln -c Release --no-build
      - name: Dependencias NuGet vulnerables
        run: |
          dotnet list src/server/Forensic.sln package --vulnerable --include-transitive | tee vulnerables.txt
          if grep -q "has the following vulnerable packages" vulnerables.txt; then exit 1; fi

  cliente:
    name: Cliente de escritorio (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build client/Forensic.Cliente.sln -c Release
      # ViewModels con dobles de la API y Avalonia.Headless para los bindings y el visor: sin pantalla.
      - run: dotnet test client/Forensic.Cliente.sln -c Release --no-build
      - name: Dependencias NuGet vulnerables
        run: |
          dotnet list client/Forensic.Cliente.sln package --vulnerable --include-transitive | tee vulnerables.txt
          if grep -q "has the following vulnerable packages" vulnerables.txt; then exit 1; fi

  cliente-empaquetado:
    name: Cliente de escritorio (empaquetado win-x64, instalador y prueba de humo)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # El mismo script que release-cliente.yml.
      - run: scripts/empaquetar-cliente.ps1 -Version v0.0.0 -Salida artefactos
        shell: pwsh
      # Lo que publica release-cliente.yml, salvo la firma: el instalador corre sin cosign.
      - name: Release de prueba
        shell: bash
        run: |
          cp scripts/instalar-cliente.ps1 despliegue/workstation/cliente.json.example artefactos/
          cd artefactos && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # El runner es administrador: instala de verdad, en Program Files y ProgramData.
      - name: Instalador
        shell: pwsh
        run: |
          # Un zip alterado no se instala.
          Copy-Item -Recurse artefactos alterado
          $alterado = [IO.File]::Open((Resolve-Path alterado/forensic-cliente-win-x64.zip), 'Append')
          $alterado.WriteByte(0); $alterado.Close()
          try { ./alterado/instalar-cliente.ps1; throw 'Instaló un zip alterado.' }
          catch { if ($_.Exception.Message -notmatch 'no es el del release') { throw } ; Write-Output "[OK] $($_.Exception.Message)" }

          ./artefactos/instalar-cliente.ps1
          $exe = Get-Item "$env:ProgramFiles\ForensicVideo\Cliente\v0.0.0-*\Forensic.Cliente.exe"
          if (-not (Test-Path "$([Environment]::GetFolderPath('CommonPrograms'))\Forensic Video.lnk")) { throw 'Falta el acceso directo.' }
          # Los usuarios leen la configuración, no la escriben.
          $usuarios = (Get-Acl "$env:ProgramData\ForensicVideo").Access |
            Where-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value -eq 'S-1-5-32-545' }
          if (@($usuarios).Count -ne 1 -or $usuarios.FileSystemRights -match 'Write|Modify|FullControl') { throw "Usuarios: $($usuarios.FileSystemRights)" }
          # Instalar la misma versión dos veces no pisa la instalada.
          try { ./artefactos/instalar-cliente.ps1; throw 'Reinstaló encima.' }
          catch { if ($_.Exception.Message -notmatch 'ya está instalada') { throw } ; Write-Output "[OK] $($_.Exception.Message)" }
          "exe=$($exe.FullName)" >> $env:GITHUB_ENV
      # El ejecutable instalado, con su configuración en ProgramData. Una salida capturada hace que
      # PowerShell espere a una aplicación de ventana.
      - name: Prueba de humo de --comprobar
        shell: pwsh
        run: |
          $config = "$env:ProgramData\ForensicVideo\cliente.json"
          function Comprobar([string]$json, [int]$esperado) {
            Set-Content $config $json
            $salida = & $env:exe --comprobar | Out-String
            $codigo = $LASTEXITCODE
            Write-Output $salida
            if ($salida -notmatch 'Forensic Video v0\.0\.0-[0-9a-f]{12}') { throw 'No informa la versión.' }
            if ($codigo -ne $esperado) { throw "Salió con $codigo; se esperaba $esperado." }
          }
          # El ejemplo que dejó el instalador no pasa: hay que completarlo.
          Comprobar (Get-Content -Raw $config) 1
          # Una variable de entorno no pisa el archivo.
          $env:FORENSIC_SERVIDOR = 'http://127.0.0.1:5065/'
          Comprobar '{ "servidor": "http://custodia.lab/" }' 1
          Comprobar '{ "servidor": "http://127.0.0.1:5065/", "workerIa": "http://gpu.lab:8100/" }' 1
          Comprobar '{ "servidor": "http://127.0.0.1:5065/" }' 2
          $http = Start-Process python -ArgumentList '-m', 'http.server', '5065', '--bind', '127.0.0.1' -PassThru
          # Hasta que escuche: un tiempo fijo a veces no alcanza en el runner.
          $escucha = $false
          for ($i = 0; $i -lt 60 -and -not $escucha; $i++) {
            try { (New-Object Net.Sockets.TcpClient('127.0.0.1', 5065)).Close(); $escucha = $true } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $escucha) { throw 'El servidor HTTP de prueba no arrancó.' }
          try { Comprobar '{ "servidor": "http://127.0.0.1:5065/" }' 0 } finally { Stop-Process -Id $http.Id }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forensic-cliente-win-x64
          path: artefactos/forensic-cliente-win-x64.zip
          retention-days: 7

  worker-ingest:
    name: Worker de ingesta (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/workers/ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  worker-procesamiento:
    name: Worker de procesamiento (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/workers/procesamiento
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Incluye los hashes dorados del PNG: falla si el entorno de Linux no reproduce byte a byte.
      - run: pytest

  worker-ia:
    name: Worker de IA (lint + test, en CPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/workers/ia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Baja los pesos del manifiesto y verifica su hash: el worker nunca descarga nada por sí mismo.
      - run: python scripts/descargar_modelos.py
      - run: pytest

  verificador:
    name: Verificador independiente (Go, vet + test + binarios)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # firma sin claves de los binarios (sólo en main)
    defaults:
      run:
        working-directory: tools/verificador
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/verificador/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      # Lo que se entrega a un perito de contraparte: binarios estáticos, sin dependencias.
      - name: Binarios
        run: |
          for p in windows/amd64 linux/amd64 linux/arm64 darwin/arm64; do
            os=${p%/*}; arq=${p#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arq CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" \
              -o "dist/verificador-$os-$arq$ext" .
          done
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # En main, SHA256SUMS se firma sin claves: un tercero comprueba que los binarios salieron de este CI.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Firmar SHA256SUMS
        working-directory: tools/verificador/dist
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verificador
          path: tools/verificador/dist/

  imagenes:
    name: Imagen ${{ matrix.nombre }} (Trivy, y en main publicar y firmar)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR, sólo en main
      id-token: write # firma sin claves con cosign, sólo en main
      security-events: write # reporte de Trivy en la pestaña de seguridad
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: servidor, contexto: ., dockerfile: src/server/Dockerfile }
          - { nombre: worker-ingest, contexto: src/workers/ingest, dockerfile: src/workers/ingest/Dockerfile }
          - { nombre: worker-procesamiento, contexto: src/workers/procesamiento, dockerfile: src/workers/procesamiento/Dockerfile }
          - { nombre: worker-ia, contexto: src/workers/ia, dockerfile: src/workers/ia/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f ${{ matrix.dockerfile }} -t forensic-${{ matrix.nombre }}:ci ${{ matrix.contexto }}
      # Con --network none: si intentara bajar un modelo, no arrancaría. Sin GPU en el CI, corre en CPU.
      - if: matrix.nombre == 'worker-ia'
        run: src/workers/ia/scripts/verificar_imagen.sh forensic-worker-ia:ci
      # Gate: falla ante cualquier vulnerabilidad alta o crítica con arreglo publicado, y ante secretos en
      # la imagen. Se escanea la imagen entera (base, runtime y, en la de IA, CUDA y cuDNN).
      - name: Trivy (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: forensic-${{ matrix.nombre }}:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Reporte completo, también lo que no tiene arreglo todavía, para seguirlo en la pestaña de seguridad.
      - name: Trivy (reporte)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: forensic-${{ matrix.nombre }}:ci
          scanners: vuln,secret
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.nombre }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/publicar-y-firmar
        with:
          imagen-local: forensic-${{ matrix.nombre }}:ci
          nombre: ${{ matrix.nombre }}

  secretos:
    name: Secretos en todo el historial (gitleaks, gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # La imagen oficial por digest (la acción de gitleaks pide licencia en organizaciones). Excepciones
      # acotadas y justificadas en .gitleaks.toml.
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  trivy:
    name: Escaneo Trivy del repositorio (dependencias, secretos, configuración)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fijada por SHA: los tags de esta acción fueron reescritos en un incidente de cadena de suministro.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    name: CodeQL (${{ matrix.lenguaje }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lenguaje: csharp, modo: none }
          - { lenguaje: python, modo: none }
          - { lenguaje: go, modo: manual }
          - { lenguaje: actions, modo: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.lenguaje == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/verificador/go.mod
          cache: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: ${{ matrix.modo }}
          # Más reglas de seguridad que el conjunto por defecto.
          queries: security-extended
      - if: matrix.lenguaje == 'go'
        working-directory: tools/verificador
        run: go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.lenguaje }}
