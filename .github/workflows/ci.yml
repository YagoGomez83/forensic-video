name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  servidor:
    name: Servidor .NET (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Los tests del informe pericial compilan y corren el verificador independiente (Go).
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/verificador/go.mod
          cache: false
      - run: dotnet restore src/server/Forensic.sln
      - run: dotnet build src/server/Forensic.sln -c Release --no-restore
      # Los tests de integración levantan PostgreSQL con Testcontainers (Docker viene en el runner).
      - run: dotnet test src/server/Forensic.sln -c Release --no-build
      - name: Dependencias NuGet vulnerables
        run: |
          dotnet list src/server/Forensic.sln package --vulnerable --include-transitive | tee vulnerables.txt
          if grep -q "has the following vulnerable packages" vulnerables.txt; then exit 1; fi

  cliente:
    name: Cliente de escritorio (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build client/Forensic.Cliente.sln -c Release
      # ViewModels con dobles de la API y Avalonia.Headless para los bindings y el visor: sin pantalla.
      - run: dotnet test client/Forensic.Cliente.sln -c Release --no-build

  worker-ingest:
    name: Worker de ingesta (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/workers/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  worker-procesamiento:
    name: Worker de procesamiento (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/workers/procesamiento
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Incluye los hashes dorados del PNG: falla si el entorno de Linux no reproduce byte a byte.
      - run: pytest

  worker-ia:
    name: Worker de IA (lint + test, en CPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/workers/ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Baja los pesos del manifiesto y verifica su hash: el worker nunca descarga nada por sí mismo.
      - run: python scripts/descargar_modelos.py
      - run: pytest

  verificador:
    name: Verificador independiente (Go, vet + test + binarios)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/verificador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/verificador/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      # Lo que se entrega a un perito de contraparte: binarios estáticos, sin dependencias.
      - name: Binarios
        run: |
          for p in windows/amd64 linux/amd64 linux/arm64 darwin/arm64; do
            os=${p%/*}; arq=${p#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arq CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}"               -o "dist/verificador-$os-$arq$ext" .
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: verificador
          path: tools/verificador/dist/

  imagen-worker-ia:
    name: Imagen del worker de IA (red cortada + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forensic-worker-ia:ci src/workers/ia
      # Con --network none: si intentara bajar un modelo, no arrancaría. Sin GPU en el CI, corre en CPU.
      - run: src/workers/ia/scripts/verificar_imagen.sh forensic-worker-ia:ci
      # Se escanea la imagen entera: onnxruntime-gpu, CUDA y cuDNN incluidos.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: forensic-worker-ia:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/server/Dockerfile -t forensic-servidor:ci .
      - run: docker build -t forensic-worker-ingest:ci src/workers/ingest
      - run: docker build -t forensic-worker-procesamiento:ci src/workers/procesamiento

  trivy:
    name: Escaneo Trivy (dependencias, secretos, configuración)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fijada por SHA: los tags de esta acción fueron reescritos en un incidente de cadena de suministro.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    name: CodeQL (${{ matrix.lenguaje }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lenguaje: csharp, modo: none }
          - { lenguaje: python, modo: none }
          - { lenguaje: go, modo: manual }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.lenguaje == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/verificador/go.mod
          cache: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: ${{ matrix.modo }}
      - if: matrix.lenguaje == 'go'
        working-directory: tools/verificador
        run: go build ./...
      - uses: github/codeql-action/analyze@v3
